# -------------------------------------------------
# Gradle Wrapper – generated once and committed.
# -------------------------------------------------
distributionBase=GRADLE_USER_HOME
distributionPath=wrapper/dists
# Use a Gradle version that is officially supported by AGP 8.5.
# Gradle 8.5 works with AGP 8.5‑8.7 and avoids the daemon‑startup bug
# that appears with very new Gradle releases on the GitHub‑hosted runners.
distributionUrl=https\://services.gradle.org/distributions/gradle-8.5-all.zip
zipStoreBase=GRADLE_USER_HOME
zipStorePath=wrapper/dists
