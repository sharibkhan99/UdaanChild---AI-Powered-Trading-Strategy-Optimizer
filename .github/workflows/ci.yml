# .github/workflows/ci.yml
name: Android CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Build Debug APK
        uses: gradle/gradle-build-action@v3
        with:
          gradle-version: 9.8
          arguments: assembleDebug --no-daemon --stacktrace

      - name: Run Unit Tests
        uses: gradle/gradle-build-action@v3
        with:
          gradle-version: 9.8
          arguments: testDebugUnitTest --no-daemon --stacktrace

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 7
