# .github/workflows/ci.yml
name: Android CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # 1️⃣ Checkout source
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2️⃣ JDK 17 (required by AGP 8.7+)
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          # disable the built‑in Gradle cache – the cache service is flaky right now
          cache: ''

      # 3️⃣ Install the exact Gradle version we need (9.8.0) – no wrapper required
      - name: Set up Gradle 9.8.0
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.8.0
          # turn off the Gradle‑cache that keeps hitting “service unavailable”
          cache-disabled: true

      # 4️⃣ Build the debug APK
      - name: Assemble Debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      # 5️⃣ Run local unit tests
      - name: Run Unit Tests
        run: gradle testDebugUnitTest --no-daemon --stacktrace

      # 6️⃣ Upload the generated APK as an artifact (kept 7 days)
      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 7
