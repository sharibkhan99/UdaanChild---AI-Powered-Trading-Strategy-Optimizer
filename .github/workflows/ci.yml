# .github/workflows/ci.yml
name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  # Heap for the GA optimiser that runs inside the test suite
  GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx2048m -Dorg.gradle.daemon=false"

jobs:
  # -------------------------------------------------
  # 1️⃣  Lint + Unit‑test
  # -------------------------------------------------
  lint-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Cache Android SDK
        id: android-sdk-cache
        uses: actions/cache@v4
        with:
          path: |
            /usr/local/lib/android/sdk
            ~/.android
          key: android-sdk-${{ runner.os }}-${{ hashFiles('.github/workflows/ci.yml') }}
          restore-keys: |
            android-sdk-${{ runner.os }}-

      - name: Set up Android SDK (v4 – Node 24 compatible)
        if: steps.android-sdk-cache.outputs.cache-hit != 'true'
        uses: android-actions/setup-android@v4
        with:
          api-level: 34
          ndk-version: 27.3.13750724      # pinned to the ubuntu‑latest default
          build-tools-version: 34.0.0
          cmake-version: 3.22.1
          accept-android-sdk-licenses: true

      # -------------------------------------------------
      # 2️⃣  Make sure the Android Gradle Plugin can be found.
      #     The plugin lives in Google’s Maven repo, so we inject that
      #     repository into *pluginManagement* via a Gradle init‑script.
      # -------------------------------------------------
      - name: Add Google Maven to pluginManagement repositories
        run: |
          mkdir -p ~/.gradle
          cat <<'EOF' > ~/.gradle/init.gradle
          settingsEvaluated { settings ->
            settings.pluginManagement {
              repositories {
                google()
                mavenCentral()
                gradlePluginPortal()
              }
            }
          }
          EOF

      # -------------------------------------------------
      # 3️⃣  Run Gradle tasks – explicit Gradle 8.5 (no wrapper needed)
      # -------------------------------------------------
      - name: Run lint (debug)
        uses: gradle/gradle-build-action@v2
        with:
          arguments: lintDebug
          gradle-version: '8.5'

      - name: Run unit tests (debug)
        uses: gradle/gradle-build-action@v2
        with:
          arguments: testDebugUnitTest
          gradle-version: '8.5'

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: app/build/reports/lint-results-debug.html

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: app/build/reports/tests/testDebugUnitTest/**

  # -------------------------------------------------
  # 4️⃣  Build APKs (only after lint+test pass)
  # -------------------------------------------------
  build-apk:
    needs: lint-and-test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.event_name == 'pull_request'
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          api-level: 34
          ndk-version: 27.3.13750724
          build-tools-version: 34.0.0
          cmake-version: 3.22.1
          accept-android-sdk-licenses: true

      # The same init‑script is needed for the build job as well
      - name: Add Google Maven to pluginManagement repositories
        run: |
          mkdir -p ~/.gradle
          cat <<'EOF' > ~/.gradle/init.gradle
          settingsEvaluated { settings ->
            settings.pluginManagement {
              repositories {
                google()
                mavenCentral()
                gradlePluginPortal()
              }
            }
          }
          EOF

      - name: Build Debug APK
        uses: gradle/gradle-build-action@v2
        with:
          arguments: assembleDebug
          gradle-version: '8.5'

      - name: Build Release APK
        uses: gradle/gradle-build-action@v2
        with:
          arguments: assembleRelease
          gradle-version: '8.5'

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: app/build/outputs/apk/release/app-release.apk

  # -------------------------------------------------
  # 5️⃣  Create a GitHub Release on every push to main
  # -------------------------------------------------
  release:
    needs: build-apk
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: Release v${{ github.run_number }}
          generate_release_notes: true
          files: |
            app/build/outputs/apk/release/app-release.apk
