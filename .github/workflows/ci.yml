# .github/workflows/ci.yml
name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  # Give the Gradle daemon enough heap for the GA‑optimiser
  GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx2048m -Dorg.gradle.daemon=false"

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # -------------------------------------------------
      # 1️⃣  Checkout (latest v4 – works on Node 24)
      # -------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # -------------------------------------------------
      # 2️⃣  JDK 17 (setup‑java v5 – no deprecation warning)
      # -------------------------------------------------
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      # -------------------------------------------------
      # 3️⃣  Android SDK (setup‑android v3 – new input schema)
      # -------------------------------------------------
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # The new action only accepts a `packages` list.
          # We ask for the platform, build‑tools and the NDK you used locally.
          packages: |
            platforms;android-34
            build-tools;34.0.0
            ndk;26.1.10909125
            cmake;3.22.1
          accept-android-sdk-licenses: true

      # -------------------------------------------------
      # 4️⃣  Make gradlew executable
      # -------------------------------------------------
      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      # -------------------------------------------------
      # 5️⃣  Run Lint (debug variant)
      # -------------------------------------------------
      - name: Run lint
        run: ./gradlew lintDebug

      # -------------------------------------------------
      # 6️⃣  Run unit tests
      # -------------------------------------------------
      - name: Run unit tests
        run: ./gradlew testDebugUnitTest

      # -------------------------------------------------
      # 7️⃣  Upload Lint HTML report (correct path)
      # -------------------------------------------------
      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: app/build/reports/lint-results-debug.html

      # -------------------------------------------------
      # 8️⃣  Upload unit‑test reports (correct glob)
      # -------------------------------------------------
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: app/build/reports/tests/testDebugUnitTest/**

  # -------------------------------------------------
  # 9️⃣  Build APKs (only after lint+test pass)
  # -------------------------------------------------
  build-apk:
    needs: lint-and-test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.event_name == 'pull_request'
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: |
            platforms;android-34
            build-tools;34.0.0
            ndk;26.1.10909125
            cmake;3.22.1
          accept-android-sdk-licenses: true

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug

      - name: Build Release APK
        run: ./gradlew assembleRelease

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: app/build/outputs/apk/release/app-release.apk

  # -------------------------------------------------
  # 🔟  Create a GitHub Release on every push to main
  # -------------------------------------------------
  release:
    needs: build-apk
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: Release v${{ github.run_number }}
          generate_release_notes: true
          files: |
            app/build/outputs/apk/release/app-release.apk
