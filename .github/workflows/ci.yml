# .github/workflows/ci.yml
name: Android CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # 1️⃣ Checkout source
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2️⃣ JDK 17 (required by AGP 8.7+)
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      # 3️⃣ Build with Gradle 9.8.0 (no wrapper needed)
      - name: Build Debug APK
        uses: gradle/gradle-build-action@v3
        with:
          gradle-version: 9.8.0
          arguments: assembleDebug --no-daemon --stacktrace

      # 4️⃣ Run unit tests
      - name: Run Unit Tests
        uses: gradle/gradle-build-action@v3
        with:
          gradle-version: 9.8.0
          arguments: testDebugUnitTest --no-daemon --stacktrace

      # 5️⃣ Upload the debug APK as an artifact
      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 7
