# -------------------------------------------------
# Gradle JVM settings
# -------------------------------------------------
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

# -------------------------------------------------
# AndroidX / Jetifier (kept for compatibility)
# -------------------------------------------------
android.useAndroidX=true
android.enableJetifier=true

# -------------------------------------------------
# **Enable AGP’s built‑in Kotlin** – removes the need for the
# separate kotlin‑android plugin and prevents the afterEvaluate crash.
# -------------------------------------------------
android.builtInKotlin=true

# -------------------------------------------------
# DhanHQ credentials (keep this file out of VCS)
# -------------------------------------------------
DHAN_CLIENT_ID=your_client_id_here
DHAN_ACCESS_TOKEN=your_access_token_here
