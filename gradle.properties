# -------------------------------------------------
# Gradle JVM settings – helps avoid OOM on large builds
# -------------------------------------------------
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

# -------------------------------------------------
# AndroidX / Jetifier (kept for compatibility with older plugins)
# -------------------------------------------------
android.useAndroidX=true
android.enableJetifier=true

# -------------------------------------------------
# DhanHQ credentials – **keep this file out of version control**
# (add `gradle.properties` to your .gitignore)
# -------------------------------------------------
DHAN_CLIENT_ID=your_client_id_here
DHAN_ACCESS_TOKEN=your_access_token_here
